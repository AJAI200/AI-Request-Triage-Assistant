services:
  - type: web
    name: ai-request-triage-assistant
    env: python
    buildCommand: "bash build.sh"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        sync: false
      - key: TOKEN_EXPIRE_MINUTES
        sync: false
      - key: API_KEY
        sync: false

services:
  - type: web
    name: ai-request-triage-assistant
    env: python
    buildCommand: "bash build.sh"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/triage.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        sync: false
      - key: TOKEN_EXPIRE_MINUTES
        sync: false
      - key: API_KEY
        sync: false

